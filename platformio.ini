[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Скорость прошивки и монитора порта
upload_speed = 921600
monitor_speed = 115200

; Настройки памяти для планок WROVER/PSRAM
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; Флаги компиляции для вызова библиотек LilyGO
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Официальные библиотеки для работы с платой и 4G-модемом A7670
lib_deps = 
    vshymanskyy/TinyGSM @ ^0.11.7
    lewisxullen/XPowersLib @ ^0.2.1

