[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.flash_mode = qio
board_build.f_flash = 80000000L

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++20

lib_deps =
    bblanchon/ArduinoJson@^7.4.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
